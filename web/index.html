<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مساعدك الذكي — محادثات ذكاء اصطناعي بالعربية على الموبايل والويب">
  <meta name="theme-color" content="#1A1338">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مساعدك الذكي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    تسجيل الدخول بحساب Google على الويب:

    1) افتح Firebase Console → Authentication → Sign-in method → Google
    2) افتح "Web SDK configuration" وانسخ "Web client ID"
       (شكله: 218133252419-xxxxxxxx.apps.googleusercontent.com)
    3) الصقه في السطر التالي بدل YOUR_WEB_CLIENT_ID ثم احذف علامات التعليق
  -->
  <!--
  <meta name="google-signin-client_id" content="YOUR_WEB_CLIENT_ID.apps.googleusercontent.com">
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مساعدك الذكي</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
