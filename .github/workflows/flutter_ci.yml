name: Flutter CI

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

concurrency:
group: flutter-ci-${{ github.ref }}
cancel-in-progress: true

jobs:
analyze-and-test:
name: Analyze + Test
runs-on: ubuntu-latest
timeout-minutes: 20
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Flutter
uses: subosito/flutter-action@v2
with:
channel: stable
flutter-version: '3.50.1'
cache: true

- name: Install dependencies
run: flutter pub get

- name: Analyze
run: flutter analyze --no-fatal-infos

- name: Format check (non-blocking warning)
run: dart format --output=none --set-exit-if-changed .
continue-on-error: true

- name: Run tests with coverage
run: flutter test --coverage

- name: Upload coverage report
uses: actions/upload-artifact@v4
with:
name: test-coverage
path: coverage/lcov.info
if-no-files-found: ignore

build-android:
name: Build Android (Debug APK)
needs: analyze-and-test
if: github.event_name == 'push' && github.ref == 'refs/heads/main'
runs-on: ubuntu-latest
timeout-minutes: 30
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Flutter
uses: subosito/flutter-action@v2
with:
channel: stable
flutter-version: '3.50.1'
cache: true

- name: Set up JDK 21
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '21'

- name: Point Flutter to JDK 21
run: flutter config --jdk-dir="$JAVA_HOME"

- name: Install dependencies
run: flutter pub get

- name: Build debug APK
run: flutter build apk --debug

- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: flutter-ai-debug-apk
path: build/app/outputs/flutter-apk/app-debug.apk06:47 AM
