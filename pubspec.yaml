name: flutter_ai_app
description: "تطبيق ذكاء اصطناعي متكامل مع Firebase، تسجيل صوت، وتحويل كلام لنص"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  dartz: ^0.10.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  file_picker: ^13.4.1
  http: ^1.3.0
  record: ^6.2.1
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.3.0  # ⬅️ 
  url_launcher: ^6.3.0  # ⬅️ ح

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5  # ⬅️ 
  bloc_test: ^10.0.0  # ⬅️

flutter:
  uses-material-design: true
