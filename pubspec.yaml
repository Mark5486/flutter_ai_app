name: flutter_ai_app
description: "تطبيق ذكاء اصطناعي متكامل مع Firebase، تسجيل صوت، وتحويل كلام لنص"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6  # ⬅️ تم التعديل للإصدار المتوفر
  google_sign_in: ^6.2.1
  dartz: ^0.10.1
  local_auth: ^2.3.0
  device_info_plus: ^12.4.0
  safe_device: ^1.4.1
  equatable: ^2.1.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  google_generative_ai: ^0.4.7
  go_router: ^17.0.0
  flutter_bloc: ^9.1.1
  file_picker: ^8.1.7
  http: ^1.3.0
  record: ^6.2.1
  audioplayers: ^6.6.0
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true